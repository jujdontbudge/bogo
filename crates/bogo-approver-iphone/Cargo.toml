[package]
name = "bogo-approver-iphone"
description = "iPhone route: numeric-comparison registration with App Attest, delivery through BOGO's relay, decision intake, notices, APNs pushes"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[features]
default = []
# Accept a registration without App Attest evidence: the simulator-only path.
# Only test builds enable it; the phone side has the matching simulator-only path.
test-registration = []

[dependencies]
bogo-approver = { path = "../bogo-approver" }
bogo-relay-proto = { path = "../bogo-relay-proto" }
bogo-e2e = { path = "../bogo-e2e" }
bogo-apns = { path = "../bogo-apns" }
bogo-attest = { path = "../bogo-attest" }
bogo-verify = { path = "../bogo-verify" }
async-trait = "0.1"
tokio = { version = "1", features = ["sync", "time", "rt", "macros"] }
serde.workspace = true
serde_json.workspace = true
x25519-dalek = { version = "2", features = ["static_secrets"] }
chacha20poly1305 = "0.10"
hkdf = "0.12"
sha2 = "0.10"
rand = "0.8"
hex = "0.4"
base64 = "0.22"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls"] }
ed25519-dalek = "2"
tracing = "0.1"
thiserror = "2"

[lints]
workspace = true
