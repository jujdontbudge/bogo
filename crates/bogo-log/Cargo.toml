[package]
name = "bogo-log"
description = "The hash-chained audit log: group-commit writer, reader, recovery, registry replay, outcome lookup, verify"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[dependencies]
bogo-core = { path = "../bogo-core" }
serde.workspace = true
serde_json.workspace = true
sha2 = "0.10"
hex = "0.4"
thiserror = "2"
tokio = { version = "1", features = ["sync"] }

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }

[lints]
workspace = true
